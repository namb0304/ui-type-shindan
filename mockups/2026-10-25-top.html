<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>トップページの作り直し（2026-10-25）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ==================================================================
       * モックアップの外側（本番には入らない）
       * ================================================================== */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0 0 80px;
        font-family: 'Noto Sans JP', system-ui, sans-serif;
        color: #1d2127;
        background-color: #eceef2;
      }

      .masthead {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
        padding: 14px 24px;
        color: #fff;
        background-color: #1d2127;
      }

      .masthead h1 {
        margin: 0;
        font-size: 15px;
      }

      .masthead__note {
        font-size: 12px;
        color: #a8aeb8;
      }

      .masthead__spacer {
        flex: 1;
      }

      .toggle {
        padding: 7px 14px;
        font: inherit;
        font-size: 12.5px;
        font-weight: 700;
        color: #c7ccd4;
        cursor: pointer;
        background-color: #30353d;
        border: none;
        border-radius: 7px;
      }

      .toggle[aria-pressed='true'] {
        color: #1d2127;
        background-color: #ffd37a;
      }

      .page {
        padding: 0 24px;
      }

      .lead {
        max-width: 64em;
        margin: 26px 0 0;
        font-size: 13.5px;
        line-height: 1.85;
        color: #4a515c;
      }

      .band {
        margin-top: 26px;
      }

      .band h2 {
        margin: 0 0 10px;
        font-size: 12px;
        color: #4a515c;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }

      figure {
        margin: 0;
      }

      figcaption {
        display: flex;
        gap: 10px;
        align-items: baseline;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 700;
        color: #4a515c;
      }

      .fold {
        padding: 2px 8px;
        font-size: 11px;
        border-radius: 999px;
      }

      .fold--ok {
        color: #1f5b3a;
        background-color: #d9f0e2;
      }

      .fold--ng {
        color: #8a3a2e;
        background-color: #fbe3de;
      }

      .device {
        position: relative;
        overflow: hidden;
        border: 1px solid #c3c8d1;
        border-radius: 14px;
        box-shadow: 0 6px 20px rgb(29 33 39 / 12%);
      }

      .device--sp {
        width: 392px;
        height: 702px;
      }

      .device--pc {
        width: 722px;
        height: 452px;
      }

      .device__scroll {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        scrollbar-width: thin;
      }

      .device--pc .device__scroll {
        width: 1440px;
        height: 900px;
        transform: scale(0.5);
        transform-origin: top left;
      }

      /* ファーストビューの境目。ここまでが「開いた瞬間に見えるところ」 */
      body.fold .device--sp .top::after {
        position: absolute;
        top: 700px;
        right: 0;
        left: 0;
        z-index: 5;
        padding: 2px 8px;
        font-size: 10px;
        color: #fff;
        content: 'ここまでがファーストビュー（390×700）';
        background-color: rgb(184 60 10 / 90%);
      }

      body.fold .device--pc .top::after {
        position: absolute;
        top: 900px;
        right: 0;
        left: 0;
        z-index: 5;
        padding: 2px 8px;
        font-size: 10px;
        color: #fff;
        content: 'ここまでがファーストビュー（1440×900）';
        background-color: rgb(184 60 10 / 90%);
      }

      /* ==================================================================
       * 本番の値（src/styles/base.css の :root）
       * ================================================================== */
      .top {
        --site-bg: #f6f7f9;
        --site-surface: #fdfdfe;
        --site-text: #1d2127;
        --site-muted: #656d78;
        --site-hairline: #e2e5ea;
        --site-accent: #3b5b7a;
        --site-gutter: 16px;

        position: relative;
        min-height: 100%;
        padding-bottom: 64px;
        font-size: 16px;
        line-height: 1.75;
        color: var(--site-text);
        background-color: var(--site-bg);
      }

      .top h1,
      .top h2,
      .top h3,
      .top p,
      .top ul,
      .top ol,
      .top li {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .top__inner {
        max-width: 760px;
        padding: 0 var(--site-gutter);
        margin: 0 auto;
      }

      /* PCでは、写真が並ぶ節だけ広げる。
       * 760pxのままだと、16枚のグリッドが真ん中で縮こまって間延びする */
      .pc .types__grid,
      .pc .layers,
      .pc .steps {
        max-width: 1040px;
        margin-right: auto;
        margin-left: auto;
      }

      /* ==================================================================
       * ファーストビュー
       *
       * 色はすべて写真から持ってくる。サイト側は白〜薄いグレーのまま
       * （結果ページで一気にテーマが変わる落差を、演出として残すため）
       * ================================================================== */
      .hero {
        padding-top: 44px;
        text-align: center;
      }

      .pc .hero {
        padding-top: 72px;
      }

      .hero__title {
        font-size: clamp(30px, 8.6vw, 40px);
        font-weight: 700;
        line-height: 1.28;
        letter-spacing: 0.01em;
        text-wrap: balance;
      }

      .pc .hero__title {
        font-size: 52px;
      }

      .hero__lead {
        max-width: 22em;
        margin: 16px auto 0;
        font-size: 15px;
        line-height: 1.9;
        color: var(--site-muted);
      }

      .pc .hero__lead {
        max-width: 30em;
        font-size: 17px;
      }

      /* 場所のチラ見せ。「こういうのが出ます」を言葉より先に見せる */
      .hero__strip {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 26px;
      }

      .hero__card {
        width: 96px;
        overflow: hidden;
        background-color: var(--site-surface);
        border: 1px solid var(--site-hairline);
        border-radius: 14px;
        box-shadow: 0 6px 16px rgb(29 33 39 / 10%);
      }

      .pc .hero__card {
        width: 148px;
      }

      /* 真ん中だけ少し持ち上げる。3枚が同じだと、ただの帯に見える */
      .hero__card:nth-child(2) {
        transform: translateY(-10px);
      }

      .hero__card img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
      }

      .hero__card-name {
        padding: 7px 6px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.4;
      }

      .pc .hero__card-name {
        padding: 10px 8px;
        font-size: 13px;
      }

      .hero__cta {
        margin-top: 26px;
      }

      .btn {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 14px 32px;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        color: #fdfdfe;
        cursor: pointer;
        background-color: var(--site-accent);
        border: none;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgb(59 91 122 / 24%);
      }

      .hero__meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        justify-content: center;
        margin-top: 14px;
        font-size: 12.5px;
        color: var(--site-muted);
      }

      .hero__meta li + li::before {
        margin-right: 14px;
        content: '';
        border-left: 1px solid var(--site-hairline);
      }

      /* ==================================================================
       * 何が分かるのか（3つの層）
       *
       * 「できること」を文で説明せず、**出てくるものの縮小版**を見せる。
       * 3つとも同じ形のカードにはせず、中身の形をそれぞれ変える
       * ================================================================== */
      .what {
        margin-top: 56px;
      }

      .pc .what {
        margin-top: 88px;
      }

      .section__title {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.5;
        text-align: center;
      }

      .pc .section__title {
        font-size: 24px;
      }

      .section__note {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.8;
        color: var(--site-muted);
        text-align: center;
      }

      .layers {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 24px;
      }

      .pc .layers {
        flex-direction: row;
        gap: 20px;
        margin-top: 32px;
      }

      .layer {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 16px;
        background-color: var(--site-surface);
        border: 1px solid var(--site-hairline);
        border-radius: 16px;
      }

      .pc .layer {
        flex: 1;
        flex-direction: column;
        padding: 20px;
      }

      .layer__body {
        min-width: 0;
      }

      .layer__title {
        font-size: 15.5px;
        font-weight: 700;
        line-height: 1.5;
      }

      .layer__note {
        margin-top: 5px;
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--site-muted);
      }

      /* --- ①出てくる場所 --- */
      .sample-place {
        flex-shrink: 0;
        width: 84px;
        overflow: hidden;
        border-radius: 10px;
      }

      .pc .sample-place {
        width: 100%;
      }

      .sample-place img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
      }

      /* --- ②定番UIキット --- */
      .sample-kit {
        flex-shrink: 0;
        width: 84px;
        padding: 8px;
        background-color: #f2f4f7;
        border-radius: 10px;
      }

      .pc .sample-kit {
        width: 100%;
        padding: 14px;
      }

      .sample-kit__row + .sample-kit__row {
        margin-top: 7px;
        border-top: 1px solid var(--site-hairline);
      }

      .sample-kit__label {
        display: block;
        padding-top: 7px;
        font-size: 8.5px;
        line-height: 1.3;
        color: var(--site-muted);
      }

      .sample-kit__name {
        display: block;
        font-size: 10.5px;
        font-weight: 700;
        line-height: 1.35;
      }

      .pc .sample-kit__label {
        font-size: 11px;
      }

      .pc .sample-kit__name {
        font-size: 14px;
      }

      /* --- ③AIに渡す設計図 --- */
      .sample-spec {
        flex-shrink: 0;
        width: 84px;
        padding: 9px;
        overflow: hidden;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 7px;
        line-height: 1.7;
        color: #c9d4e2;
        background-color: #273243;
        border-radius: 10px;
      }

      .pc .sample-spec {
        width: 100%;
        padding: 14px;
        font-size: 11px;
      }

      .sample-spec b {
        color: #ffd37a;
        font-weight: 400;
      }

      /* ==================================================================
       * 16タイプの場所
       * ================================================================== */
      .types {
        margin-top: 56px;
      }

      .pc .types {
        margin-top: 88px;
      }

      .types__grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 22px;
      }

      .pc .types__grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-top: 30px;
      }

      .type {
        overflow: hidden;
        background-color: var(--site-surface);
        border: 1px solid var(--site-hairline);
        border-radius: 12px;
      }

      .type img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
      }

      /* 名前は1行のものと2行のものが混ざる。
       * 2行ぶんの高さを確保して、行の下端をそろえる */
      .type__name {
        padding: 6px 7px 8px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.35;
        min-height: calc(1.35em * 2 + 14px);
      }

      .pc .type__name {
        padding: 9px 10px 11px;
        font-size: 14px;
        min-height: calc(1.35em * 2 + 20px);
      }

      /* ==================================================================
       * 遊び方（3ステップ）
       * ================================================================== */
      .how {
        margin-top: 56px;
      }

      .pc .how {
        margin-top: 88px;
      }

      .steps {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 22px;
      }

      .pc .steps {
        flex-direction: row;
        gap: 16px;
        margin-top: 30px;
      }

      .step {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 14px 16px;
        background-color: var(--site-surface);
        border: 1px solid var(--site-hairline);
        border-radius: 14px;
      }

      .pc .step {
        flex: 1;
      }

      .step__n {
        display: grid;
        flex-shrink: 0;
        width: 26px;
        height: 26px;
        font-size: 13px;
        font-weight: 700;
        color: var(--site-surface);
        background-color: var(--site-accent);
        border-radius: 50%;
        place-items: center;
      }

      .step__text {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
      }

      /* ==================================================================
       * 下の開始ボタンと注記
       * ================================================================== */
      .foot {
        margin-top: 56px;
        text-align: center;
      }

      .pc .foot {
        margin-top: 88px;
      }

      .foot__note {
        max-width: 28em;
        margin: 22px auto 0;
        font-size: 12px;
        line-height: 1.85;
        color: var(--site-muted);
      }
    </style>
  </head>

  <body>
    <div class="masthead">
      <h1>トップページの作り直し</h1>
      <span class="masthead__note">枠の中はスクロールします</span>
      <span class="masthead__spacer"></span>
      <button type="button" class="toggle" id="foldToggle" aria-pressed="false">
        ファーストビューの境目を出す
      </button>
    </div>

    <div class="page" id="page"></div>

    <script>
      const BASE = '/images/shops/thumbs';

      /** 16タイプ（src/data/typeInfos.ts と同じ呼び名） */
      const TYPES = [
        ['DFCG', '市役所の窓口'],
        ['DFCM', '古本屋'],
        ['DFPG', '激安スーパー'],
        ['DFPM', '町中華'],
        ['DRCG', '空港の出発ロビー'],
        ['DRCM', 'アンティーク時計店'],
        ['DRPG', 'ゲームセンター'],
        ['DRPM', 'お祭りの屋台通り'],
        ['AFCG', '北欧の家具屋'],
        ['AFCM', '美術館'],
        ['AFPG', 'おしゃれなジェラート屋'],
        ['AFPM', '街角の花屋'],
        ['ARCG', 'スマホの旗艦店'],
        ['ARCM', '高級ホテルのロビー'],
        ['ARPG', 'テーマパークの入口'],
        ['ARPM', '老舗旅館'],
      ];

      /** ファーストビューでチラ見せする3つ。雰囲気がいちばん離れた組み合わせ */
      const PEEK = ['DFPM', 'AFCM', 'DRPG'];

      function card(code, name) {
        return `
          <div class="hero__card">
            <img src="${BASE}/${code}.webp" alt="" />
            <p class="hero__card-name">${name}</p>
          </div>`;
      }

      function topPage() {
        const peek = PEEK.map((code) => card(code, TYPES.find((t) => t[0] === code)[1])).join('');

        const types = TYPES.map(
          ([code, name]) => `
          <div class="type">
            <img src="${BASE}/${code}.webp" alt="" loading="lazy" />
            <p class="type__name">${name}</p>
          </div>`,
        ).join('');

        return `
          <div class="top">
            <div class="top__inner">

              <header class="hero">
                <h1 class="hero__title">デザインの好み、<br />場所でいうと？</h1>
                <p class="hero__lead">
                  「どっちが好き？」を選ぶだけ。あなたの好きなUIが、16タイプの「場所」で分かります。
                </p>
                <div class="hero__strip">${peek}</div>
                <div class="hero__cta"><button type="button" class="btn">診断をはじめる</button></div>
                <ul class="hero__meta">
                  <li>全22問</li><li>約5分</li><li>登録なし</li>
                </ul>
              </header>

              <section class="what">
                <h2 class="section__title">答えると、3つが分かります</h2>
                <div class="layers">
                  <div class="layer">
                    <div class="sample-place"><img src="${BASE}/ARPM.webp" alt="" loading="lazy" /></div>
                    <div class="layer__body">
                      <h3 class="layer__title">好みが「場所」で分かる</h3>
                      <p class="layer__note">
                        あなたのデザインの好みを、16タイプの場所にたとえます。
                      </p>
                    </div>
                  </div>

                  <div class="layer">
                    <div class="sample-kit">
                      <div class="sample-kit__row">
                        <span class="sample-kit__label">お知らせの出し方</span>
                        <span class="sample-kit__name">トースト</span>
                      </div>
                      <div class="sample-kit__row">
                        <span class="sample-kit__label">一覧の見せ方</span>
                        <span class="sample-kit__name">カード</span>
                      </div>
                    </div>
                    <div class="layer__body">
                      <h3 class="layer__title">よく使うUIの名前が分かる</h3>
                      <p class="layer__note">
                        「お知らせはトースト派」のような、あなたの定番がまとまります。部品の名前も覚えられます。
                      </p>
                    </div>
                  </div>

                  <div class="layer">
                    <div class="sample-spec">
                      <b>## デザイントークン</b><br />
                      :root {<br />
                      &nbsp;&nbsp;--radius: 20px;<br />
                      &nbsp;&nbsp;--space: 16px;<br />
                      }<br />
                      <b>## 使いたいUI部品</b><br />
                      - お知らせ：トースト
                    </div>
                    <div class="layer__body">
                      <h3 class="layer__title">AIに渡せる設計図がもらえる</h3>
                      <p class="layer__note">
                        ChatGPTなどに貼り付けるだけで、あなた好みの見た目で画面を作ってくれます。
                      </p>
                    </div>
                  </div>
                </div>
              </section>

              <section class="types">
                <h2 class="section__title">16タイプの場所</h2>
                <p class="section__note">この中のどれかが、あなたのタイプです。</p>
                <div class="types__grid">${types}</div>
              </section>

              <section class="how">
                <h2 class="section__title">遊び方</h2>
                <div class="steps">
                  <div class="step"><span class="step__n">1</span><p class="step__text">2つの画面を見比べる</p></div>
                  <div class="step"><span class="step__n">2</span><p class="step__text">好きなほうを選ぶ</p></div>
                  <div class="step"><span class="step__n">3</span><p class="step__text">結果が出る</p></div>
                </div>
              </section>

              <section class="foot">
                <button type="button" class="btn">診断をはじめる</button>
                <p class="foot__note">
                  遊びの診断です。科学的な根拠はありません。答えた内容はこの端末の中だけで、どこにも送られません。
                </p>
              </section>

            </div>
          </div>`;
      }

      document.getElementById('page').innerHTML = `
        <p class="lead">
          開いた瞬間に「何ができて、何が分かるのか」が伝わることを狙っています。
          上のボタンで、スマホ390×700／PC1440×900のファーストビューの境目を出せます。
        </p>
        <div class="band">
          <div class="row">
            <figure>
              <figcaption>スマホ 390×700 <span class="fold fold--ok" id="spFold">…</span></figcaption>
              <div class="device device--sp"><div class="device__scroll">${topPage()}</div></div>
            </figure>
            <figure>
              <figcaption>PC 1440×900（50%に縮小）</figcaption>
              <div class="device device--pc"><div class="device__scroll pc">${topPage()}</div></div>
            </figure>
          </div>
        </div>`;

      // ファーストビューに収まっているかを測る
      function measure() {
        const sp = document.querySelector('.device--sp');
        const meta = sp.querySelector('.hero__meta');
        const bottom = meta.getBoundingClientRect().bottom - sp.getBoundingClientRect().top;
        const badge = document.getElementById('spFold');
        const fits = bottom <= 700;
        badge.className = `fold fold--${fits ? 'ok' : 'ng'}`;
        badge.textContent = fits
          ? `開始ボタンまで ${Math.round(bottom)}px（収まる）`
          : `開始ボタンまで ${Math.round(bottom)}px（はみ出す）`;
      }

      const foldToggle = document.getElementById('foldToggle');
      foldToggle.addEventListener('click', () => {
        const on = foldToggle.getAttribute('aria-pressed') !== 'true';
        foldToggle.setAttribute('aria-pressed', String(on));
        document.body.classList.toggle('fold', on);
      });

      window.addEventListener('load', measure);
      if (document.fonts) document.fonts.ready.then(measure);
    </script>
  </body>
</html>
